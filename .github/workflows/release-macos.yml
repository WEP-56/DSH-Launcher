name: Release macOS

on:
  push:
    tags:
      - 'v*'
  # 手动补跑：macOS 构建失败时不必为了重试再发一个版本号，
  # 直接对着已存在的 tag 跑一次，产物会挂到该 tag 对应的 Release 上。
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建并上传的 tag（例如 v0.7.2）'
        required: true

# 同 release.yml：仓库 Workflow permissions 必须是 “Read and write permissions”，
# 只写这里的 contents: write 会被仓库的只读设置压回去。
permissions:
  contents: write

jobs:
  publish-tauri:
    name: Build and release macOS app
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 手动补跑时检出 tag 对应的源码，而不是默认分支。
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable (universal target)
        uses: dtolnay/rust-toolchain@stable
        with:
          # universal-apple-darwin 不是 rustup 的目标，装它会直接失败
          # （component 'rust-std' for target 'universal-apple-darwin' is unavailable）。
          # tauri 是把下面两个真实目标的产物 lipo 成通用二进制，所以装这两个。
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish macOS release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 可选：在仓库 Secrets 中配置以下变量后自动签名并公证。
          # 留空时产出未签名的 .app/.dmg（本地可用，但首次打开会被 Gatekeeper 拦截）。
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tauriScript: npm run tauri
          # 产出同时支持 Apple Silicon 与 Intel 的通用二进制。
          args: --target universal-apple-darwin
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: DSH Launcher ${{ inputs.tag || github.ref_name }}
          releaseBody: |
            DSH Launcher macOS release (universal) for ${{ inputs.tag || github.ref_name }}.

            Download the .dmg below — it runs on both Apple Silicon and Intel Macs.
            If Gatekeeper blocks it, right-click the app and choose Open, or run
            `xattr -cr /Applications/DSH\ Launcher.app`.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true

name: Release Windows

on:
  push:
    tags:
      - 'v*'
  # 手动补跑：构建失败时不必为了重试而删标签或改版本号，
  # 直接对着已存在的 tag 跑一次，产物会挂到该 tag 对应的 Release 上。
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建并上传的 tag（例如 v0.7.2）'
        required: true

# 注意：这里声明 contents: write 还不够，仓库
# Settings → Actions → General → Workflow permissions 必须是
# “Read and write permissions”，否则 GITHUB_TOKEN 会被仓库设置压回只读，
# 构建能成功但创建 Release 时报 “Resource not accessible by integration”。
permissions:
  contents: write

jobs:
  publish-tauri:
    name: Build and release Windows app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 手动补跑时检出 tag 对应的源码，而不是默认分支。
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish Windows release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npm run tauri
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: DSH Launcher ${{ inputs.tag || github.ref_name }}
          releaseBody: |
            DSH Launcher Windows release for ${{ inputs.tag || github.ref_name }}.

            Download the Windows installer from the assets below.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true

[package]
name = "dsh-launcher"
version = "0.7.0"
description = "Desktop launcher for DeepSeek Harness"
authors = ["DSH Launcher contributors"]
edition = "2021"

[lib]
name = "dsh_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
rfd = "0.16"
ureq = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

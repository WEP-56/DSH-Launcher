[package]
name = "dsh-launcher"
version = "0.7.0"
description = "Desktop launcher for DeepSeek Harness"
authors = ["DSH Launcher contributors"]
edition = "2021"

[lib]
name = "dsh_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2"
rfd = "0.16"
ureq = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# 只有 macOS 用它做标题栏的原生振动模糊，别让 Windows/Linux 白编译一遍。
[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.5"
